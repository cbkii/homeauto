services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    # privileged: true is the recommended default for HA Container to support
    # hardware integrations (Bluetooth via D-Bus, USB, some HA core features).
    # See docs/SUPPORT_BOUNDARIES.md §Container privilege for the Phase C
    # capabilities-based alternative and its known limitations.
    privileged: true
    # PHASE C ALTERNATIVE — experimental, not default.  Replace privileged: true
    # with the block below after testing all required integrations on your hardware.
    # Not all HA integrations are guaranteed to work without full privilege.
    #   privileged: false
    #   cap_add:
    #     - NET_ADMIN    # mDNS / multicast, network management integrations
    #     - NET_RAW      # raw sockets (some integrations need this)
    #     - SYS_RAWIO    # raw I/O for some USB/serial integrations
    #   security_opt:
    #     - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - ./ha:/config
      - /run/dbus:/run/dbus:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8123/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    network_mode: host
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u $$MQTT_USER -P $$MQTT_PASS -t ha/health -m ok -q"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE}:/dev/zigbee
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
