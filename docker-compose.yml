name: homeauto
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  stop_grace_period: 60s

services:
  homeassistant:
    <<: *runtime
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    network_mode: host
    environment:
      TZ: ${TZ:-Australia/Sydney}
    volumes:
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/ha:/config
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s

  mosquitto:
    <<: *runtime
    image: eclipse-mosquitto:2.0.22
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    environment:
      XDG_CONFIG_HOME: /health
    volumes:
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/mosquitto/config:/mosquitto/config:ro
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/mosquitto/data:/mosquitto/data
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/mosquitto/health:/health:ro
    healthcheck:
      test: [CMD, mosquitto_pub, -h, 127.0.0.1, -t, homeauto/health, -m, ok]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zigbee2mqtt:
    <<: *runtime
    profiles: ["zigbee"]
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE:-/dev/null}:/dev/zigbee
    environment:
      TZ: ${TZ:-Australia/Sydney}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  mariadb:
    <<: *runtime
    profiles: ["mariadb"]
    image: mariadb:11.8.3
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root
      MARIADB_DATABASE: homeauto
      MARIADB_USER: homeauto
      MARIADB_PASSWORD_FILE: /run/secrets/db_user
      TZ: ${TZ:-Australia/Sydney}
    secrets: [db_root, db_user]
    volumes:
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/mariadb:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  esphome:
    <<: *runtime
    profiles: ["extras"]
    image: ghcr.io/esphome/esphome:2026.10.2
    network_mode: host
    environment:
      TZ: ${TZ:-Australia/Sydney}
    volumes:
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/esphome:/config
    command: [dashboard, /config, --address, 127.0.0.1, --port, "6052"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6052/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nodered:
    <<: *runtime
    profiles: ["extras"]
    image: nodered/node-red:4.1.1
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      TZ: ${TZ:-Australia/Sydney}
    volumes:
      - ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/nodered:/data
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:1880/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

secrets:
  db_root:
    file: ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/private/db_root
  db_user:
    file: ${HOMEAUTO_DATA_DIR:-/srv/homeauto}/private/db_user
