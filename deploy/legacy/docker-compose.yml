services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    network_mode: host
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ}
    volumes:
      - ./ha:/config
      - /run/dbus:/run/dbus:ro
    depends_on:
      mariadb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8123/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    network_mode: host
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u $$MQTT_USER -P $$MQTT_PASS -t ha/health -m ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  zigbee2mqtt:
    profiles: ["zigbee"]
    image: koenkk/zigbee2mqtt:2
    container_name: zigbee2mqtt
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE}:/dev/zigbee
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  esphome:
    profiles: ["extras"]
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./esphome:/config
    command: ["dashboard", "/config", "--address", "0.0.0.0", "--port", "6052"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6052/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  nodered:
    profiles: ["extras"]
    image: nodered/node-red:4
    container_name: nodered
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./nodered:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:1880/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
