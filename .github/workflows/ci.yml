name: ci

on:
  pull_request:
  push:
    branches: ["main", "master", "work"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck docker-compose-plugin
      - name: Run QA checks
        run: ./scripts/qa.sh
