name: ci
on:
  pull_request:
  push:
    branches: [main, master, work]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # Explicit bash => GitHub runs with -eo pipefail, so piped failures fail the job.
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml python3-venv
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install 'paho-mqtt==2.1.0'
          docker compose version
      - name: Source QA and all profile combinations
        run: ./scripts/qa.sh
      - name: Real MQTT authentication and ACL checks
        run: .venv/bin/python tests/integration_broker.py
      - name: Consistent backup and isolated SQL restoration
        if: matrix.os == 'ubuntu-24.04'
        run: sudo python3 tests/integration_recovery.py
      - name: Generated Zigbee2MQTT settings accepted by pinned image schema
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tests/integration_zigbee_config.py
      - name: Commissioning check over real broker and ACLs
        if: matrix.os == 'ubuntu-24.04'
        run: sudo python3 tests/integration_commissioning.py
      - name: Real HA/MQTT lifecycle (absent dongle, health, backup, failure recovery)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo python3 tests/integration_core_lifecycle.py
      - name: ARM64 and AMD64 image availability
        run: |
          mkdir -p artifacts
          python3 scripts/diagnostics/image-manifests.py --format json > artifacts/images.json
      - name: Upload public source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence-${{ matrix.os }}
          path: artifacts/images.json
          retention-days: 14
