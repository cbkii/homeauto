name: ci
on:
  pull_request:
  push:
    branches: [main, master, work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          docker compose version
      - name: Source QA and all profile combinations
        run: ./scripts/qa.sh
      - name: ARM64 and AMD64 image availability
        run: |
          mkdir -p artifacts
          python3 scripts/diagnostics/image-manifests.py --format json > artifacts/images.json
      - name: Upload public source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence-${{ matrix.os }}
          path: artifacts/images.json
          retention-days: 14
