name: ci

on:
  pull_request:
  push:
    branches: ["main", "master", "work"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck docker-compose-plugin
      - name: Prepare CI environment
        # qa.sh runs 'docker compose config' which requires env vars from .env.
        # In CI we use the example file (no real secrets or devices needed for config validation).
        run: cp .env.example .env
      - name: Run QA checks
        run: |
          mkdir -p artifacts
          ./scripts/qa.sh 2>&1 | tee artifacts/qa-output.txt
          docker compose config 2>&1 | tee artifacts/compose-config.yml
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
