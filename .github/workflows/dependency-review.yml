name: dependency-review

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

# Scans dependency changes introduced by a PR for known vulnerabilities.
# Requires GitHub Advanced Security or is available for free on public repos.
# See: https://docs.github.com/en/code-security/supply-chain-security/about-dependency-review
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Dependency review unsupported notice
        if: ${{ github.event.repository.private }}
        run: |
          echo "Skipping dependency-review-action for private repository without guaranteed GHAS support."
          echo "Enable Dependency graph + GitHub Advanced Security to enforce this check on private repos."
          echo "Settings: https://github.com/${{ github.repository }}/settings/security_analysis"
      - name: Run dependency review
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9  # v4.7.1
